<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sobre o Eletroposto BR</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="conta.dc.html" aria-label="Voltar para a conta" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 20px">

<div>
<h1 style="margin: 0 0 0 9px; font-size: 0; line-height: 0">
<sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
<img src="assets/logo-sem-slogan-tag-negativo.svg" alt="Eletroposto BR by EnergyClub" style="width: 340px; height: auto; display: block">
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
<img src="assets/logo-sem-slogan-tag-cor.svg" alt="Eletroposto BR by EnergyClub" style="width: 340px; height: auto; display: block">
</sc-if>
</h1>
<p style="margin: 12px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Encontre estações de recarga, inicie a recarga e acompanhe o valor, tudo pelo app. O Eletroposto BR é da EnergyClub.</p>
</div>

<section aria-labelledby="como" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="como" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">COMO TRABALHAMOS</h2>
<div style="border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<sc-for list="{{principios}}" as="p" hint-placeholder-count="3">
<div style="box-sizing: border-box; padding: 12px 14px; border-top: {{p.borda}}">
<div style="font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; color: var(--heading)">{{p.titulo}}</div>
<div style="margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--ink)">{{p.texto}}</div>
</div>
</sc-for>
</div>
</section>

<section aria-label="Informações do app" style="border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 0 14px">
<span style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--heading)">Versão do app</span>
<span style="flex: none; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted)">[0.0.0]</span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--heading); font-family: var(--font-sans); text-align: left; cursor: pointer">
<span style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 700">Licenças de código aberto</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--ink-muted)"><path d="M9 5l7 7-7 7"></path></svg>
</button>
<a href="termos.dc.html" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; box-sizing: border-box; padding: 0 14px; border-top: 1px solid var(--line); color: var(--heading); text-decoration: none">
<span style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 700">Termos e privacidade</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--ink-muted)"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</section>

</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted)">
<div>© [ano] EnergyClub</div>
<div>CNPJ [00.000.000/0000-00]</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'light';
const linha = '1px solid var(--line)';
return {
theme: theme,
isDark: theme === 'dark',
isLight: theme !== 'dark',
principios: [
{ titulo: 'Transparência', texto: 'Você vê o valor estimado antes de iniciar a recarga.', borda: 'none' },
{ titulo: 'Honestidade', texto: 'O recibo mostra o total final, com a energia entregue e o preço por kWh.', borda: linha },
{ titulo: 'Confiança', texto: 'Se algo não sair como esperado, o suporte atende pelo WhatsApp.', borda: linha }
]
};
}
}
</script>
</body>
</html>
