<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajuda e suporte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="conta.dc.html" aria-label="Voltar para a conta" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column; gap: 20px">

<div>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Ajuda e suporte</h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Fale com a gente ou veja as respostas mais comuns.</p>
</div>

<section aria-label="Falar com o suporte" style="display: flex; flex-direction: column; gap: 12px">
<div style="box-sizing: border-box; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface-raised)">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-tint); color: var(--accent-text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z"></path></svg></span>
<span style="min-width: 0">
<span style="display: block; font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; color: var(--heading)">Atendimento pelo WhatsApp</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted)">[Horário de atendimento]</span>
</span>
</div>
<button type="button" class="ebr-btn ebr-btn--primary ebr-btn--block" style="height: 48px; margin-top: 14px">Falar pelo WhatsApp</button>
<div style="margin-top: 10px; text-align: center; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted)">[(00) 00000-0000]</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent-text)"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 8l8.5 6 8.5-6"></path></svg>
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: block; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--heading)">Prefere e-mail?</span>
<span style="display: block; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted)">[e-mail do suporte]</span>
</span>
</div>
</section>

<section aria-labelledby="faq" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="faq" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">PERGUNTAS FREQUENTES</h2>
<div style="border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<sc-for list="{{perguntas}}" as="q" hint-placeholder-count="5">
<div style="border-top: {{q.borda}}">
<button type="button" aria-expanded="{{q.aberta}}" onClick="{{q.alternar}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; background: transparent; color: var(--heading); font-family: var(--font-sans); text-align: left; cursor: pointer">
<span style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 700">{{q.pergunta}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--ink-muted)"><path d="{{q.seta}}"></path></svg>
</button>
<div style="display: {{q.mostrar}}; padding: 0 14px 14px; font-size: 13px; line-height: 19px; color: var(--ink)">{{q.resposta}}</div>
</div>
</sc-for>
</div>
</section>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const aberta = (this.state && this.state.aberta != null) ? this.state.aberta : 0;
const dados = [
{ pergunta: 'A recarga não iniciou', resposta: 'Leia o QR Code do carregador e confira se o cabo está bem encaixado no carro e no carregador. Tente de novo e, se não funcionar, fale com o suporte.' },
{ pergunta: 'A recarga parou sozinha', resposta: 'A recarga pode parar quando a bateria chega ao limite de carga ou por uma falha. O motivo aparece no recibo. Se tiver dúvida, fale com o suporte.' },
{ pergunta: 'O valor está diferente do esperado', resposta: 'Antes de iniciar, o app mostra o valor estimado. O total final aparece no recibo, com a energia entregue e o preço por kWh.' },
{ pergunta: 'Como adicionar saldo com Pix', resposta: 'Em Carteira, toque em Adicionar saldo, escolha o valor e pague o Pix no app do seu banco.' },
{ pergunta: 'Meu cartão foi recusado', resposta: 'Confira o número, a validade e o código de segurança. Se continuar, tente outro cartão ou fale com o suporte.' }
];
const perguntas = dados.map((d, i) => {
const on = i === aberta;
return {
pergunta: d.pergunta,
resposta: d.resposta,
aberta: on,
mostrar: on ? 'block' : 'none',
seta: on ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
borda: i === 0 ? 'none' : '1px solid var(--line)',
alternar: () => this.setState({ aberta: on ? -1 : i })
};
});
return { theme: this.props.theme ?? 'light', perguntas: perguntas };
}
}
</script>
</body>
</html>
