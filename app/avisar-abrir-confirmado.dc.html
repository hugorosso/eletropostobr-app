<!doctype html>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; gap: 12px; height: 44px">
<a href="mapa-logado.dc.html" aria-label="Fechar e voltar ao mapa" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--heading)">Aviso combinado</h1>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 92px; display: flex; flex-direction: column">

<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: var(--radius-card); background: var(--surface-tint); color: var(--accent-text)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path><path d="M9.5 11.6l1.8 1.8 3.2-3.4"></path></svg></span>

<h2 style="margin: 20px 0 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Vamos avisar você.</h2>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Quando a Estação [nome] abrir, você recebe um aviso.</p>

<div style="margin-top: 24px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; box-sizing: border-box; padding: 0 16px">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Estação</span>
<span style="font-size: 14px; line-height: 21px; font-weight: 700; color: var(--heading)">Estação [nome]</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Abertura prevista</span>
<span style="font-family: var(--font-mono); font-size: 14px; line-height: 21px; font-weight: 500; color: var(--heading)">[MÊS/ANO]</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Avisar por</span>
<span style="font-size: 14px; line-height: 21px; font-weight: 700; color: var(--heading)">Notificação no app</span>
</div>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="mapa-logado.dc.html" style="height: 48px; text-decoration: none">Ver o mapa</a>
<a href="em-breve.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--danger); text-decoration: underline">Cancelar aviso</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>

return { theme: this.props.theme ?? 'light' };
}
}
</script>
