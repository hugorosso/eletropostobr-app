</svg>
</div>
</div>

<div style="display: flex; align-items: center; min-height: 52px; margin-top: 14px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink)">[código Pix copia e cola]</span>
</div>
<button type="button" class="ebr-btn ebr-btn--outline ebr-btn--block" onClick="{{copiar}}" style="height: 48px; margin-top: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icone1}}"></path><path d="{{icone2}}"></path></svg>
<span aria-live="polite">{{rotuloCopiar}}</span>
</button>

<section aria-labelledby="como" style="display: flex; flex-direction: column; gap: 4px; margin-top: 18px">
<h2 id="como" style="margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">COMO PAGAR</h2>
<sc-for list="{{passos}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 40px">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--secondary); color: var(--on-secondary); font-family: var(--font-display); font-size: 14px; font-weight: 800">{{p.n}}</span>
<span style="font-size: 13px; line-height: 19px; color: var(--ink)">{{p.texto}}</span>
</div>
</sc-for>
</section>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="carteira.dc.html" style="height: 48px; text-decoration: none">Já fiz o pagamento</a>
<a href="saldo.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--accent-text); text-decoration: underline">Cancelar</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const copiado = !!(this.state && this.state.copiado);
return {
theme: this.props.theme ?? 'light',
rotuloCopiar: copiado ? 'Código copiado' : 'Copiar código',
icone1: copiado ? 'M5 12.5l4.5 4.5L19 7.5' : 'M10 9h8.5A1.5 1.5 0 0 1 20 10.5V19a1.5 1.5 0 0 1-1.5 1.5H10A1.5 1.5 0 0 1 8.5 19v-8.5A1.5 1.5 0 0 1 10 9z',
icone2: copiado ? '' : 'M15.5 9V5.5A1.5 1.5 0 0 0 14 4H5.5A1.5 1.5 0 0 0 4 5.5V14a1.5 1.5 0 0 0 1.5 1.5H8.5',
copiar: () => this.setState({ copiado: true }),
passos: [
{ n: '1', texto: 'Abra o app do seu banco e escolha pagar com Pix.' },
{ n: '2', texto: 'Leia o QR Code ou cole o código copiado.' },
{ n: '3', texto: 'Confirme o valor e o pagamento. O saldo aparece na Carteira.' }
]
};
}
}
</script>
</body>
</html>
