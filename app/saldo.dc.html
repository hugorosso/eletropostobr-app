<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adicionar saldo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="carteira.dc.html" aria-label="Voltar para a carteira" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Adicionar saldo</h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Pague com Pix e use o saldo nas recargas.</p>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin-top: 20px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Saldo atual</span>
<span style="font-family: var(--font-mono); font-size: 16px; line-height: 24px; font-weight: 500; color: var(--heading)">R$ [0,00]</span>
</div>

<section aria-labelledby="valor" style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
<h2 id="valor" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">ESCOLHA O VALOR</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{opcoes}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 56px; padding: 0 8px; box-sizing: border-box; border: 1.5px solid {{o.borda}}; border-radius: var(--radius-tile); background: {{o.fundo}}; color: {{o.cor}}; font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; cursor: pointer">{{o.rotulo}}</button>
</sc-for>
</div>
</section>

<div style="margin-top: 16px">
<x-import component-from-global-scope="EletropostoBR.Field" label="Outro valor" placeholder="R$ 0,00" inputmode="decimal" hint="Valor mínimo de R$ [0,00]."></x-import>
</div>

<div style="display: flex; align-items: center; gap: 12px; margin-top: 20px; box-sizing: border-box; padding: 14px; border-radius: var(--radius-tile); background: var(--surface-tint)">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-raised); color: var(--accent-text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><path d="M14 14h2.5v2.5H14zM20 14v2.5M17 20h3"></path></svg></span>
<span style="font-size: 13px; line-height: 19px; color: var(--ink)">Você paga no app do seu banco. O saldo entra quando o pagamento for confirmado.</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; line-height: 19px; color: var(--ink-muted)">Valor do Pix</span>
<span style="font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--heading)">{{resumo}}</span>
</div>
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="pix.dc.html" style="height: 48px; text-decoration: none">Gerar Pix</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel != null) ? this.state.sel : 1;
const valores = ['R$ [20]', 'R$ [50]', 'R$ [100]', 'R$ [200]'];
const opcoes = valores.map((v, i) => {
const on = i === sel;
return {
rotulo: v,
on: on,
fundo: on ? 'var(--selected)' : 'var(--surface-raised)',
borda: on ? 'var(--selected)' : 'var(--line-strong)',
cor: on ? 'var(--on-selected)' : 'var(--heading)',
pick: () => this.setState({ sel: i })
};
});
return { theme: this.props.theme ?? 'light', opcoes: opcoes, resumo: valores[sel] };
}
}
</script>
</body>
</html>
