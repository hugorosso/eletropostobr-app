<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<div style="position: absolute; left: 0; top: 0; right: 0; height: 268px; overflow: hidden; background: var(--surface-tint); border-radius: 0 0 var(--radius-panel) var(--radius-panel)">
<svg width="390" height="132" viewBox="0 0 390 132" aria-hidden="true" style="position: absolute; left: 0; top: 136px; display: block">
<defs>
<pattern id="padraoRaios" width="96" height="120" patternUnits="userSpaceOnUse">
<g style="fill: var(--heading); stroke: var(--heading)" stroke-width="12" stroke-linejoin="round" opacity="0.14">
<g transform="translate(-2 4) scale(0.3)">
<path d="M130 18 L48 104 H106 Z"></path>
<path d="M94 96 H152 L70 182 Z"></path>
</g>
<g transform="translate(46 62) scale(0.3)">
<path d="M130 18 L48 104 H106 Z"></path>
<path d="M94 96 H152 L70 182 Z"></path>
</g>
</g>
</pattern>
</defs>
<rect width="390" height="132" fill="url(#padraoRaios)"></rect>
</svg>
<sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
<img src="assets/logo-sem-slogan-tag-negativo.svg" alt="Eletroposto BR by EnergyClub" style="position: absolute; left: 25px; top: 36px; width: 340px; height: auto; display: block">
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
<img src="assets/logo-sem-slogan-tag-cor.svg" alt="Eletroposto BR by EnergyClub" style="position: absolute; left: 25px; top: 36px; width: 340px; height: auto; display: block">
</sc-if>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 296px; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Entre e recarregue.</h1>
<p style="margin: 8px 0 0; font-size: 17px; line-height: 27px; color: var(--ink)">Recarregue, reserve e pague pelo app.</p>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px">
<x-import component-from-global-scope="EletropostoBR.Field" label="E-mail ou celular" placeholder="nome@email.com" autocomplete="username"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="Senha" type="password" placeholder="Sua senha" autocomplete="current-password"></x-import>
</div>

<div style="display: flex; justify-content: flex-end">
<a href="recuperar.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 13px; font-weight: 700; color: var(--accent-text); text-decoration: underline">Esqueci a senha</a>
</div>

<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="mapa-logado.dc.html" style="margin-top: 4px; text-decoration: none">Entrar</a>
<a class="ebr-btn ebr-btn--outline ebr-btn--block" href="cadastro.dc.html" style="margin-top: 10px; text-decoration: none">Criar conta</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 6px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--accent-text); text-decoration: underline">Continuar sem entrar</a>
<p style="margin: 14px 0 0; font-size: 12px; line-height: 16px; color: var(--ink-muted)">Ao continuar, você aceita os termos de uso e a política de privacidade.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'light';
return { theme: theme, isDark: theme === 'dark', isLight: theme !== 'dark' };
}
}
</script>
</body>
</html>
