<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de crédito</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="carteira.dc.html" aria-label="Voltar para a carteira" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Cartão de crédito</h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Cadastre um cartão para pagar as recargas.</p>

<section aria-label="Prévia do cartão" style="position: relative; height: 176px; margin-top: 16px; box-sizing: border-box; overflow: hidden; border-radius: var(--radius-block); background: var(--gradient-floresta)">
<svg width="100" height="144" viewBox="0 0 126 182" aria-hidden="true" style="position: absolute; right: -22px; top: -34px; display: block">
<defs>
<linearGradient id="ctU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8DF8BC"></stop><stop offset="1" stop-color="#2BE07A"></stop></linearGradient>
<linearGradient id="ctL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C853"></stop><stop offset="1" stop-color="#0E9F55"></stop></linearGradient>
</defs>
<g transform="translate(-40 -10)">
<path d="M130 18 L48 104 H106 Z" fill="url(#ctU)" stroke="url(#ctU)" stroke-width="12" stroke-linejoin="round"></path>
<path d="M94 96 H152 L70 182 Z" fill="url(#ctL)" stroke="url(#ctL)" stroke-width="12" stroke-linejoin="round"></path>
</g>
</svg>
<div style="position: absolute; left: 20px; top: 18px; font-family: var(--font-mono); font-size: 12px; line-height: 16px; letter-spacing: 0.14em; color: var(--verde-claro)">CARTÃO DE CRÉDITO</div>
<div style="position: absolute; left: 20px; top: 76px; font-family: var(--font-mono); font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: 0.06em; color: var(--branco)">•••• •••• •••• [0000]</div>
<div style="position: absolute; left: 20px; bottom: 16px">
<div style="font-family: var(--font-mono); font-size: 10px; line-height: 14px; letter-spacing: 0.12em; color: var(--texto-sobre-floresta)">NOME NO CARTÃO</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 700; color: var(--branco)">[NOME SOBRENOME]</div>
</div>
<div style="position: absolute; right: 20px; bottom: 16px; text-align: right">
<div style="font-family: var(--font-mono); font-size: 10px; line-height: 14px; letter-spacing: 0.12em; color: var(--texto-sobre-floresta)">VALIDADE</div>
<div style="font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--branco)">[MM/AA]</div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 16px">
<x-import component-from-global-scope="EletropostoBR.Field" label="Número do cartão" placeholder="0000 0000 0000 0000" inputmode="numeric" autocomplete="cc-number"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="Nome no cartão" placeholder="Como está impresso" autocomplete="cc-name"></x-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<x-import component-from-global-scope="EletropostoBR.Field" label="Validade" placeholder="MM/AA" inputmode="numeric" autocomplete="cc-exp"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="Código de segurança" type="password" placeholder="000" inputmode="numeric" autocomplete="cc-csc"></x-import>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin-top: 14px; box-sizing: border-box; padding: 0 6px 0 14px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<span style="font-size: 14px; line-height: 20px; font-weight: 700; color: var(--heading)">Usar como forma principal</span>
<button type="button" role="switch" aria-checked="{{principal}}" aria-label="Usar como forma principal" onClick="{{alternar}}" style="flex: none; display: flex; align-items: center; justify-content: center; width: 60px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
<span aria-hidden="true" style="position: relative; display: block; width: 52px; height: 32px; border-radius: 999px; background: {{trilho}}">
<span style="position: absolute; top: 4px; left: {{posicao}}; display: block; width: 24px; height: 24px; border-radius: 999px; background: {{botao}}"></span>
</span>
</button>
</div>

<div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 12px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 0; color: var(--accent-text)"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
<span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">Seus dados de cartão são protegidos por [processadora de pagamento].</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="carteira.dc.html" style="height: 48px; text-decoration: none">Salvar cartão</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const principal = !(this.state && this.state.principal === false);
return {
theme: this.props.theme ?? 'light',
principal: principal,
trilho: principal ? 'var(--selected)' : 'var(--line-strong)',
botao: principal ? 'var(--on-selected)' : 'var(--surface-raised)',
posicao: principal ? '24px' : '4px',
alternar: () => this.setState({ principal: !principal })
};
}
}
</script>
</body>
</html>
