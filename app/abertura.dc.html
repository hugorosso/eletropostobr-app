<style>
body{margin:0}
@keyframes ab-entra-cima { 0% { opacity: 0; transform: translate(22px, -22px); } 100% { opacity: 1; transform: translate(0, 0); } }
@keyframes ab-entra-baixo { 0% { opacity: 0; transform: translate(-22px, 22px); } 100% { opacity: 1; transform: translate(0, 0); } }
@keyframes ab-acende { 0%, 100% { filter: drop-shadow(0 0 0 rgba(78, 235, 139, 0)); } 50% { filter: drop-shadow(0 0 26px rgba(78, 235, 139, 0.55)); } }
@keyframes ab-sobe { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes ab-corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@keyframes ab-ponto { 0%, 20% { opacity: 0.2; } 50%, 80% { opacity: 1; } 100% { opacity: 0.2; } }
.ab-cima { animation: ab-entra-cima 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both; }
.ab-baixo { animation: ab-entra-baixo 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 550ms both; }
.ab-simbolo { animation: ab-acende 2400ms ease-in-out 1250ms infinite; }
.ab-logo { animation: ab-sobe 600ms cubic-bezier(0.2, 0.8, 0.2, 1) 900ms both; }
.ab-luz { animation: ab-corre 1600ms cubic-bezier(0.45, 0, 0.25, 1) 200ms infinite; }
.ab-ponto { display: inline-block; animation: ab-ponto 1200ms ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
.ab-cima, .ab-baixo, .ab-simbolo, .ab-logo, .ab-ponto { animation: none; }
.ab-luz { animation: none; width: 100%; border-radius: 0; }
}
</style>
</helmet>
