<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entre para continuar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="Main.dc.html" aria-label="Fechar e voltar ao mapa" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 92px; display: flex; flex-direction: column">

<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: var(--radius-card); background: var(--surface-tint); color: var(--accent-text)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path><path d="M12 15v2"></path></svg></span>

<h1 style="margin: 20px 0 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Entre para continuar.</h1>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Você pode explorar o mapa e as estações sem conta. Para recarregar, reservar e pagar, entre ou crie a sua.</p>

<section aria-labelledby="beneficios" style="margin-top: 24px; display: flex; flex-direction: column; gap: 4px">
<h2 id="beneficios" style="margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">COM A SUA CONTA</h2>
<sc-for list="{{beneficios}}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent-text)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 14px; line-height: 20px; color: var(--ink)">{{b.texto}}</span>
</div>
</sc-for>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="entrar.dc.html" style="height: 48px; text-decoration: none">Entrar</a>
<a class="ebr-btn ebr-btn--outline ebr-btn--block" href="cadastro.dc.html" style="height: 48px; text-decoration: none">Criar conta</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
beneficios: [
{ texto: 'Recarregar e acompanhar o valor' },
{ texto: 'Reservar um ponto por até 15 min' },
{ texto: 'Pagar com cartão, Pix ou saldo' },
{ texto: 'Ver seu histórico e seus recibos' },
{ texto: 'Gerenciar seus dados e notificações' }
]
};
}
}
</script>
</body>
</html>
