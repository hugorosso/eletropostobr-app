<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="entrar.dc.html" aria-label="Voltar para entrar" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<a href="entrar.dc.html" style="position: absolute; right: 16px; top: 16px; display: flex; align-items: center; min-height: 44px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--accent-text); text-decoration: underline">Já tenho conta</a>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Crie sua conta.</h1>

<a role="checkbox" aria-checked="false" href="cadastro-pj.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; margin-top: 8px; text-decoration: none; font-size: 13px; line-height: 19px; color: var(--ink)">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--surface-raised)"></span>
<span>Estou me cadastrando como <span style="font-weight: 700; color: var(--heading)">pessoa jurídica</span></span>
</a>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
<x-import component-from-global-scope="EletropostoBR.Field" label="Nome completo" placeholder="Nome e sobrenome" autocomplete="name"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="CPF" placeholder="000.000.000-00" inputmode="numeric"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="E-mail" type="email" placeholder="nome@email.com" autocomplete="email"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="Celular" type="tel" placeholder="(00) 00000-0000" autocomplete="tel"></x-import>
<x-import component-from-global-scope="EletropostoBR.Field" label="Senha" type="password" placeholder="Mínimo de [8] caracteres" autocomplete="new-password"></x-import>
</div>

<button type="button" role="checkbox" aria-checked="{{aceito}}" onClick="{{alternar}}" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 44px; margin-top: 8px; padding: 10px 0; border: 0; background: transparent; text-align: left; font-family: var(--font-sans); cursor: pointer">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; box-sizing: border-box; border: 1.5px solid {{caixaBorda}}; border-radius: 8px; background: {{caixaFundo}}; color: var(--on-selected)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{marca}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 13px; line-height: 19px; color: var(--ink)">Li e aceito os <span style="font-weight: 700; color: var(--accent-text); text-decoration: underline">termos de uso</span> e a <span style="font-weight: 700; color: var(--accent-text); text-decoration: underline">política de privacidade</span>.</span>
</button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="mapa-logado.dc.html" style="height: 48px; text-decoration: none">Criar conta</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const aceito = !!(this.state && this.state.aceito);
return {
theme: this.props.theme ?? 'light',
aceito: aceito,
caixaFundo: aceito ? 'var(--selected)' : 'var(--surface-raised)',
caixaBorda: aceito ? 'var(--selected)' : 'var(--line-strong)',
marca: aceito ? 1 : 0,
alternar: () => this.setState({ aceito: !aceito })
};
}
}
</script>
</body>
</html>
