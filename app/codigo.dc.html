<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Código de verificação</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<a href="recuperar.dc.html" aria-label="Voltar" style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: var(--radius-block); background: var(--surface-tint); color: var(--accent-text)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 8l8.5 6 8.5-6"></path></svg></span>
<h1 style="margin: 20px 0 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Digite o código.</h1>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 21px; color: var(--ink)">Enviamos um código de [6] dígitos para [e-mail ou celular].</p>

<div role="group" aria-label="Código de verificação" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px">
<sc-for list="{{digitos}}" as="d" hint-placeholder-count="6">
<input class="ebr-field__input" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="{{d.rotulo}}" placeholder="0" style="width: 100%; min-width: 0; height: 56px; padding: 0; text-align: center; font-family: var(--font-mono); font-size: 24px; font-weight: 500">
</sc-for>
</div>

<p style="margin: 20px 0 0; font-size: 13px; line-height: 19px; color: var(--ink-muted)">Não chegou? Você pode pedir um novo código em <span style="font-family: var(--font-mono); font-weight: 500; color: var(--heading)">[00:30]</span>.</p>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="nova-senha.dc.html" style="height: 48px; text-decoration: none">Confirmar código</a>
<a href="recuperar.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--accent-text); text-decoration: underline">Usar outro e-mail ou celular</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
digitos: [
{ rotulo: 'Dígito 1 de 6' },
{ rotulo: 'Dígito 2 de 6' },
{ rotulo: 'Dígito 3 de 6' },
{ rotulo: 'Dígito 4 de 6' },
{ rotulo: 'Dígito 5 de 6' },
{ rotulo: 'Dígito 6 de 6' }
]
};
}
}
</script>
</body>
</html>
