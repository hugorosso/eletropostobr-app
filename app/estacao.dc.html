<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Detalhe da estação</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; gap: 12px; height: 44px">
<a href="mapa-logado.dc.html" aria-label="Voltar ao mapa" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--heading)">Estação [nome]</h1>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column; gap: 16px">

<x-import component-from-global-scope="EletropostoBR.StationCard" variant="destaque" eyebrow="Potência máxima" power="[150]" unit="kW" status="Disponível agora · [2] de [4] livres"></x-import>

<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent-text)"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
<span style="font-size: 14px; line-height: 21px; color: var(--ink)">[Endereço da estação], [cidade] · [1,2] km</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent-text)"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span style="font-size: 14px; line-height: 21px; color: var(--ink)">Horário: [00:00 às 00:00]</span>
</div>
</div>

<section aria-labelledby="conectores" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="conectores" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">CONECTORES</h2>
<div style="border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised); overflow: hidden">
<sc-for list="{{conectores}}" as="c" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 0 14px; border-top: {{c.borda}}">
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: block; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--heading)">{{c.nome}}</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted)">[Conector] · [150] kW</span>
</span>
<sc-if value="{{c.livre}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="EletropostoBR.Pill" tone="disponivel" icon="{{yes}}">Disponível</x-import>
</sc-if>
<sc-if value="{{c.emUso}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="EletropostoBR.Pill" tone="em-uso">Em uso</x-import>
</sc-if>
</div>
</sc-for>
<a href="reservar.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 0 14px; border-top: 1px solid var(--line); background: var(--surface-tint); color: var(--heading); text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent-text)"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: block; font-size: 14px; line-height: 20px; font-weight: 700">Reservar por até 15 min</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted)">Guarde o ponto enquanto você chega.</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--ink-muted)"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</div>
</section>

<section aria-labelledby="preco" style="display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<h2 id="preco" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">PREÇO</h2>
<div style="font-family: var(--font-mono); font-size: 20px; line-height: 28px; font-weight: 500; color: var(--heading)">R$ [0,00]/kWh</div>
<div style="font-size: 13px; line-height: 19px; color: var(--ink-muted)">Você vê o valor estimado antes de iniciar a recarga.</div>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; gap: 10px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<button type="button" class="ebr-btn ebr-btn--outline" style="flex: 1 1 0; min-width: 0; height: 48px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5L20 4l-7.5 16-1.8-6.7z"></path></svg>Como chegar</button>
<a class="ebr-btn ebr-btn--primary" href="ler-qr.dc.html" style="flex: 1.4 1 0; min-width: 0; height: 48px; text-decoration: none">Iniciar recarga</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const linha = '1px solid var(--line)';
const mk = (nome, livre, primeira) => ({ nome: nome, livre: livre, emUso: !livre, borda: primeira ? 'none' : linha });
return {
theme: this.props.theme ?? 'light',
yes: true,
conectores: [
mk('Carregador [1]', true, true),
mk('Carregador [2]', true, false),
mk('Carregador [3]', false, false),
mk('Carregador [4]', false, false)
]
};
}
}
</script>
</body>
</html>
