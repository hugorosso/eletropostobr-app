<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estação em breve</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<section aria-label="Primeira estação" style="position: absolute; left: 16px; right: 16px; top: 16px; height: 260px; box-sizing: border-box; overflow: hidden; border-radius: var(--radius-panel); background: var(--gradient-raio-gigante)">
<svg width="180" height="260" viewBox="0 0 126 182" aria-hidden="true" style="position: absolute; right: -50px; bottom: -70px; display: block">
<defs>
<linearGradient id="ebU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8DF8BC"></stop><stop offset="1" stop-color="#2BE07A"></stop></linearGradient>
<linearGradient id="ebL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C853"></stop><stop offset="1" stop-color="#0E9F55"></stop></linearGradient>
</defs>
<g transform="translate(-40 -10)">
<path d="M130 18 L48 104 H106 Z" fill="url(#ebU)" stroke="url(#ebU)" stroke-width="12" stroke-linejoin="round"></path>
<path d="M94 96 H152 L70 182 Z" fill="url(#ebL)" stroke="url(#ebL)" stroke-width="12" stroke-linejoin="round"></path>
</g>
</svg>
<div style="position: absolute; left: 24px; top: 24px; width: 210px">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--verde-claro)">PRIMEIRA ESTAÇÃO</div>
<h1 style="margin: 10px 0 0; font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 800; letter-spacing: -0.04em; color: var(--branco)">Estamos chegando à sua região.</h1>
</div>
<div style="position: absolute; left: 24px; bottom: 24px; font-family: var(--font-mono); font-size: 12px; line-height: 16px; letter-spacing: 0.14em; color: var(--texto-sobre-floresta)">ABERTURA PREVISTA<br>[MÊS/ANO]</div>
</section>

<div style="position: absolute; left: 16px; right: 16px; top: 292px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 72px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: var(--surface-tint); color: var(--accent-text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg></span>
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: block; font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; color: var(--heading)">Estação [nome]</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted)">[Endereço], [cidade]</span>
</span>
<x-import component-from-global-scope="EletropostoBR.Pill" tone="em-uso">Em breve</x-import>
</div>

<section aria-labelledby="como" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="como" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent-text)">COMO VAI FUNCIONAR</h2>
<sc-for list="{{passos}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--secondary); color: var(--on-secondary); font-family: var(--font-display); font-size: 14px; font-weight: 800">{{p.n}}</span>
<span style="font-size: 14px; line-height: 21px; color: var(--ink)">{{p.texto}}</span>
</div>
</sc-for>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="avisar-abrir.dc.html" style="height: 48px; text-decoration: none">Avisar quando abrir</a>
<a class="ebr-btn ebr-btn--outline ebr-btn--block" href="mapa-logado.dc.html" style="height: 48px; text-decoration: none">Ver o mapa</a>
</div>

<nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface-raised); border-top: 1px solid var(--line)">
<a href="mapa-logado.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 800; color: var(--heading)">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px; background: var(--selected); color: var(--on-selected-accent)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg></span>Mapa</a>
<a href="recarga.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-muted)">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13.5h6.5L10.5 22 19 10h-6.5z"></path></svg></span>Recarga</a>
<a href="carteira.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-muted)">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"></path><rect x="4" y="8" width="16" height="11" rx="2.5"></rect><circle cx="16" cy="13.5" r="0.9"></circle></svg></span>Carteira</a>
<a href="conta.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-muted)">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path></svg></span>Conta</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
passos: [
{ n: '1', texto: 'Encontre a estação no mapa.' },
{ n: '2', texto: 'Conecte o carro e inicie pelo app.' },
{ n: '3', texto: 'Acompanhe a recarga e pague pelo app.' }
]
};
}
}
</script>
</body>
</html>
