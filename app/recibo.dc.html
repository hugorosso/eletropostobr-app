<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recibo da recarga</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/eletroposto-br/components/bundle.css">
<script src="ds/eletroposto-br/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">

<div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; height: 44px">
<a href="mapa-logado.dc.html" aria-label="Fechar e voltar ao mapa" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-raised); color: var(--heading); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 84px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 6px">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 10px; border-radius: var(--radius-block); background: var(--gradient-corrente); color: var(--verde-floresta)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">Recarga concluída.</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: var(--ink-muted)">Estação [nome] · [dd/mm/aaaa] · [hh:mm]</p>
</div>

<section aria-label="Resumo da recarga" style="border: 1px solid var(--line); border-radius: var(--radius-tile); background: var(--surface-raised)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 0 16px">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Energia entregue</span>
<span style="font-family: var(--font-mono); font-size: 14px; line-height: 21px; font-weight: 500; color: var(--heading)">[18,4] kWh</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Duração</span>
<span style="font-family: var(--font-mono); font-size: 14px; line-height: 21px; font-weight: 500; color: var(--heading)">[24] min</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Preço</span>
<span style="font-family: var(--font-mono); font-size: 14px; line-height: 21px; font-weight: 500; color: var(--heading)">R$ [0,00]/kWh</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<span style="font-size: 14px; line-height: 21px; color: var(--ink-muted)">Pagamento</span>
<span style="font-size: 14px; line-height: 21px; font-weight: 700; color: var(--heading)">Cartão final [0000]</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line); background: var(--surface-tint); border-radius: 0 0 var(--radius-tile) var(--radius-tile)">
<span style="font-size: 14px; line-height: 21px; font-weight: 700; color: var(--heading)">Total</span>
<span style="font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.03em; color: var(--heading)">R$ [0,00]</span>
</div>
</section>

<section aria-labelledby="feedback" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="feedback" style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px; font-weight: 700; color: var(--heading)">Como foi a recarga?</h2>
<div style="display: flex; gap: 8px">
<sc-for list="{{opinioes}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="flex: 1 1 0; min-width: 0; height: 44px; padding: 0 8px; box-sizing: border-box; border: 1.5px solid {{o.borda}}; border-radius: var(--radius-pill); background: {{o.fundo}}; color: {{o.cor}}; font-family: var(--font-sans); font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer">{{o.rotulo}}</button>
</sc-for>
</div>
<div>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: transparent; font-family: var(--font-sans); font-size: 13px; font-weight: 700; color: var(--accent-text); text-decoration: underline; cursor: pointer">Relatar um problema</button>
</div>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line)">
<a class="ebr-btn ebr-btn--primary ebr-btn--block" href="mapa-logado.dc.html" style="height: 48px; text-decoration: none">Concluir</a>
<button type="button" class="ebr-btn ebr-btn--outline ebr-btn--block" style="height: 48px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10v17l-2.5-1.6L12 20.5l-2.5-1.6L7 20.5z"></path><path d="M10 8.5h4M10 12h4"></path></svg>Baixar recibo</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel != null) ? this.state.sel : -1;
const rotulos = ['Boa', 'Regular', 'Teve problema'];
const opinioes = rotulos.map((r, i) => {
const on = i === sel;
return {
rotulo: r,
on: on,
fundo: on ? 'var(--selected)' : 'var(--surface-raised)',
borda: on ? 'var(--selected)' : 'var(--line-strong)',
cor: on ? 'var(--on-selected)' : 'var(--heading)',
pick: () => this.setState({ sel: i })
};
});
return { theme: this.props.theme ?? 'light', opinioes: opinioes };
}
}
</script>
</body>
</html>
